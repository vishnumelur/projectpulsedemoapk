<style>
  .pp * { box-sizing:border-box; font-family:'Hanken Grotesk', system-ui, sans-serif; margin:0; }
  .pp { --navy:#16205A; --blue:#0000FE; --cyan:#31D1FF; --grey:#EAEAEA; --mute:#6b7196; --line:#E6E8F0; --bg:#F7F8FC; }

  .body { flex:1; position:relative; z-index:2; padding:0 16px; display:flex; flex-direction:column; min-height:0; }
  .aur { position:absolute; border-radius:50%; filter:blur(45px); z-index:0; }

  .a-b { width:200px; height:190px; background:var(--blue); left:-110px; top:-30px; opacity:.18; animation:drift 14s ease-in-out infinite; }
